# 🤖 自动更新港澳六合彩资料
# 每天凌晨3点（北京时间）自动运行

name: Auto Update Materials

on:
  # 定时触发：每天凌晨3点（UTC+8 = UTC-5）
  schedule:
    - cron: '0 19 * * *'  # UTC 19:00 = 北京时间 03:00
  
  # 手动触发（测试用）
  workflow_dispatch:
  
  # 推送触发（开发时调试用）
  push:
    paths:
      - 'scripts/cloudflare-crawler.js'
      - '.github/workflows/auto-update.yml'

jobs:
  update-materials:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2. 设置Node.js环境
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # 3. 安装依赖
      - name: 📦 Install Dependencies
        run: |
          npm install axios cheerio sharp dotenv
      
      # 4. 运行爬虫
      - name: 🕷️ Run Crawler
        env:
          # Cloudflare R2 配置（从GitHub Secrets读取）
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          
          # Cloudflare D1 配置
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
          # 通知配置（可选）
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          echo "🚀 开始更新资料..."
          node scripts/cloudflare-crawler.js
      
      # 5. 提交更新记录（可选，记录爬取日志）
      - name: 📝 Commit Update Logs
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # 如果有新的日志文件
          if [ -n "$(git status --porcelain logs/)" ]; then
            git add logs/
            git commit -m "📊 Auto-update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "ℹ️ 没有新的更新记录"
          fi
      
      # 6. 发送成功通知
      - name: ✅ Success Notification
        if: success()
        run: |
          echo "✅ 更新成功完成！"
          echo "📊 更新时间: $(date)"
      
      # 7. 发送失败通知
      - name: ❌ Failure Notification
        if: failure()
        run: |
          echo "❌ 更新失败！"
          echo "请检查日志排查问题"

  # 可选：触发Cloudflare Pages重新部署
  trigger-deploy:
    runs-on: ubuntu-latest
    needs: update-materials
    if: success()
    
    steps:
      - name: 🚀 Trigger Cloudflare Pages Deploy
        run: |
          curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}'
      
      - name: ✅ Deploy Triggered
        run: |
          echo "✅ Cloudflare Pages 部署已触发"
          echo "⏱️ 预计2-5分钟后生效"
