name = "sixcai-api"
main = "workers/api.js"
compatibility_date = "2024-01-01"

# Cloudflare R2 绑定
[[r2_buckets]]
binding = "MATERIALS_BUCKET"
bucket_name = "sixcai-materials"

# Cloudflare D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "sixcai-db"
database_id = "your-database-id"  # 从 Cloudflare Dashboard 获取

# 环境变量
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://your-domain.com"

# 台湾彩管理 API Worker
[env.taiwan-admin]
name = "sixcai-taiwan-admin"
main = "workers/taiwan-admin-api.js"
compatibility_date = "2024-01-01"

[[env.taiwan-admin.r2_buckets]]
binding = "MATERIALS_BUCKET"
bucket_name = "sixcai-materials"

[[env.taiwan-admin.d1_databases]]
binding = "DB"
database_name = "sixcai-db"
database_id = "your-database-id"

[env.taiwan-admin.vars]
ADMIN_PASSWORD = "your-secure-password"  # 修改为强密码
