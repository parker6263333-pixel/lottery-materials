# Cloudflare Workers 配置文件
name = "wz-lottery-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# R2 存储桶绑定
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lottery-materials"
preview_bucket_name = "lottery-materials"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "lottery-materials-db"
database_id = "96786cd7-cb51-4c5e-9f9b-c3b391e7d0bf"

# 环境变量
[vars]
ADMIN_PASSWORD = "" # 设置管理员密码

# 开发环境配置
[env.dev]
name = "wz-lottery-api-dev"

# 生产环境配置
[env.production]
name = "wz-lottery-api-prod"
